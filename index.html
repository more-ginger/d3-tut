<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D3.js Tutorial</title>

  <!-- D3 v7 -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>

  <style>
    /* ── Reset & base ───────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #222;
      padding: 2rem;
    }

    h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
    p.subtitle { color: #666; margin-bottom: 2rem; }

    /* ── Chart container ────────────────────────── */
    #chart {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 1.5rem;
      display: inline-block;
    }

    /* ── Bar styles ─────────────────────────────── */
    .bar {
      fill: steelblue;
      transition: fill 0.2s;
    }

    .bar:hover { fill: #2a6090; }

    /* ── Axes ───────────────────────────────────── */
    .axis text { font-size: 0.75rem; fill: #555; }
    .axis path,
    .axis line { stroke: #ccc; }

    /* ── Tooltip ────────────────────────────────── */
    #tooltip {
      position: fixed;
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 0.4rem 0.7rem;
      border-radius: 4px;
      font-size: 0.8rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }
  </style>
</head>
<body>

  <h1>D3.js Tutorial Scaffold</h1>
  <p class="subtitle">A simple bar chart.</p>

  <div id="chart"></div>
  <div id="tooltip"></div>

  <script>
    // ── Data ───────────────────────────────────────
    const data = [
      { label: "Jan", value: 42 },
      { label: "Feb", value: 68 },
      { label: "Mar", value: 55 },
      { label: "Apr", value: 80 },
      { label: "May", value: 35 },
      { label: "Jun", value: 72 },
    ];

    // ── Dimensions ────────────────────────────────
    const margin = { top: 20, right: 20, bottom: 40, left: 50 };
    const width  = 520 - margin.left - margin.right;
    const height = 320 - margin.top  - margin.bottom;

    // ── SVG root ──────────────────────────────────
    const svg = d3.select("#chart")
      .append("svg")
        .attr("width",  width  + margin.left + margin.right)
        .attr("height", height + margin.top  + margin.bottom)
      .append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

    // ── Scales ────────────────────────────────────
    const x = d3.scaleBand()
      .domain(data.map(d => d.label))
      .range([0, width])
      .padding(0.25);

    const y = d3.scaleLinear()
      .domain([0, d3.max(data, d => d.value) * 1.1])
      .nice()
      .range([height, 0]);

    // ── Axes ──────────────────────────────────────
    svg.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

    svg.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y).ticks(5));

    // ── Tooltip helpers ───────────────────────────
    const tooltip = d3.select("#tooltip");

    function showTooltip(event, d) {
      tooltip
        .style("opacity", 1)
        .html(`<strong>${d.label}</strong>: ${d.value}`);
      moveTooltip(event);
    }

    function moveTooltip(event) {
      tooltip
        .style("left", (event.clientX + 12) + "px")
        .style("top",  (event.clientY - 28) + "px");
    }

    function hideTooltip() {
      tooltip.style("opacity", 0);
    }

    // ── Bars ──────────────────────────────────────
    svg.selectAll(".bar")
      .data(data)
      .join("rect")
        .attr("class", "bar")
        .attr("x",     d => x(d.label))
        .attr("y",     d => y(d.value))
        .attr("width",  x.bandwidth())
        .attr("height", d => height - y(d.value))
      .on("mouseover", showTooltip)
      .on("mousemove", moveTooltip)
      .on("mouseleave", hideTooltip);
  </script>

</body>
</html>
